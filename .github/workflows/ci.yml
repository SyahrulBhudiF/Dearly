name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@dearly/domain --filter=@dearly/rpc
      - run: bun run check --filter=@dearly/web

  check-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@dearly/domain --filter=@dearly/rpc
      - run: bun run check --filter=@dearly/worker

  test-web:
    needs: [check-web, check-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test --filter=@dearly/web

  test-worker:
    needs: [check-web, check-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test --filter=@dearly/worker

  build-web:
    needs: [test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@dearly/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  deploy:
    needs: [lint, check-web, check-worker, test-web, test-worker, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=@dearly/domain --filter=@dearly/rpc --filter=@dearly/worker
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Validate deploy secrets
        env:
          DEARLY_DOMAIN: ${{ secrets.DEARLY_DOMAIN }}
          CF_ACCESS_OWNER_EMAILS: ${{ secrets.CF_ACCESS_OWNER_EMAILS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
        run: |
          test -n "$DEARLY_DOMAIN"
          test -n "$CF_ACCESS_OWNER_EMAILS"
          test -n "$CF_ACCESS_TEAM_DOMAIN"
      - run: cd apps/worker && bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEARLY_DOMAIN: ${{ secrets.DEARLY_DOMAIN }}
          CF_ACCESS_OWNER_EMAILS: ${{ secrets.CF_ACCESS_OWNER_EMAILS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          APP_ENV: production
